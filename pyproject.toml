[project]
name = "qa-util-development"
version = "0.1.0"
description = "qa_util 两端联合开发与集成测试环境"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "qa-util-client",
    "qa-util-server",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
]

[tool.uv]
package = false

[tool.uv.sources]
qa-util-client = { path = "client", editable = true }
qa-util-server = { path = "server", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["server/tests", "client/tests", "tests"]
pythonpath = ["server/tests", "tests"]
