[project]
name = "qa-util-server"
version = "0.1.0"
description = "智慧树问答任务管理与内容生成服务"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1,<4",
    "waitress>=3,<4",
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
]

[project.scripts]
qa_util_server = "qa_util_server.app:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_util_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
