<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>qa_util 管理</title>
<style>
body{font:15px system-ui,sans-serif;max-width:1100px;margin:32px auto;padding:0 20px;color:#252a32;background:#f5f6f8}
header{display:flex;align-items:center;justify-content:space-between}h1{font-size:24px}h2{font-size:18px}
section,details{background:white;border:1px solid #ddd;border-radius:7px;padding:18px;margin:16px 0}
label{display:inline-block;margin:5px 12px 5px 0}input,button{font:inherit;padding:7px;margin:3px 0}
input[type=url]{width:min(650px,90%)}input[type=number]{width:75px}button{cursor:pointer}
table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #eee;padding:9px;vertical-align:top}
small,.muted{color:#68717c}.error{color:#a32929;white-space:pre-wrap}
.inline{display:inline}.actions{display:flex;gap:8px;margin:12px 0}progress{max-width:140px}summary{cursor:pointer}
.account-actions{text-align:right;white-space:nowrap}
.account-actions button+button{margin-left:8px}
.danger{color:#a32929}
.management-dialog{width:min(400px,calc(100% - 64px));border:1px solid #ddd;border-radius:7px;padding:24px}
.management-dialog::backdrop{background:#0005}.management-dialog input:not([type=hidden]){box-sizing:border-box;width:100%}
.management-dialog .actions{justify-content:flex-end}
#token-value{font-family:monospace}
</style>
<header><h1>qa_util · 管理</h1>{% if session.admin %}<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf() }}"><button>退出</button></form>{% endif %}</header>
{% block content %}{% endblock %}</html>
